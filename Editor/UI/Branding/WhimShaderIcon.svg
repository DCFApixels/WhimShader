  <polyline points="5,13 7,13 11,8" fill="none" stroke="#D66A0F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1" y="1" width="4" height="4" rx="0.75" fill="#F28C28"/>
  <rect x="1" y="11" width="4" height="4" rx="0.75" fill="#F28C28"/>
  <rect x="11" y="6" width="4" height="4" rx="0.75" fill="#F28C28"/>
